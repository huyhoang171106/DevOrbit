spring:
  application:
    name: devorbit-api
  
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/devorbit_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

app:
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}
  github:
    api-url: ${GITHUB_API_URL:https://api.github.com}
    user-agent: ${GITHUB_USER_AGENT:DevOrbit/1.0}
    token: ${GITHUB_TOKEN:}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  openapi:
    local-dev-url: ${OPENAPI_LOCAL_DEV_URL:http://localhost:8080}
    contact-email: ${API_CONTACT_EMAIL:devorbit@uit.edu.vn}
  opencode:
    api-url: ${OPENCODE_API_URL:https://opencode.ai/zen/go/v1}
    api-key: ${OPENCODE_API_KEY:}
    model: ${OPENCODE_MODEL:deepseek-v4-flash}

server:
  port: ${SERVER_PORT:8080}

supabase:
  url: ${SUPABASE_URL:}
  key: ${SUPABASE_KEY:}
  bucket: ${SUPABASE_BUCKET:devorbit}
