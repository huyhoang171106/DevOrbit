spring:
  config:
    import: optional:file:.env.properties
  main:
    banner-mode: off
  jmx:
    enabled: false
  devtools:
    restart:
      enabled: false
  application:
    name: devorbit-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  sql:
    init:
      mode: never
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 86400
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/devorbit_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 600000
      leak-detection-threshold: 60000

  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  data:
    web:
      pageable:
        page-serialization-mode: VIA_DTO

server:
  port: ${SERVER_PORT:8080}
  max-http-form-post-size: 10MB
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024
  tomcat:
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB
    max-post-size: 10485760
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    connection-timeout: 10000
    keep-alive-timeout: 20000
    max-keep-alive-requests: 100

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
  github:
    api-url: ${GITHUB_API_URL:https://api.github.com}
    user-agent: ${GITHUB_USER_AGENT:DevOrbit/1.0}
    token: ${GITHUB_TOKEN:}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  openapi:
    local-dev-url: ${OPENAPI_LOCAL_DEV_URL:http://localhost:8080}
    contact-email: ${API_CONTACT_EMAIL:devorbit@uit.edu.vn}
  opencode:
    api-url: ${OPENCODE_API_URL:https://opencode.ai/zen/go/v1}
    api-key: ${OPENCODE_API_KEY:}
    model: ${OPENCODE_MODEL:deepseek-v4-flash}
  embedding:
    offline: ${EMBEDDING_OFFLINE:false}
    provider: ${EMBEDDING_PROVIDER:fireworks}
    model: ${EMBEDDING_MODEL:accounts/fireworks/models/qwen3-embedding-8b}
    dimensions: ${EMBEDDING_DIMENSIONS:4096}
    fireworks:
      api-key: ${FIREWORKS_API_KEY:}
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}

exa:
  enabled: ${EXA_ENABLED:true}
  api-url: ${EXA_API_URL:https://api.exa.ai}
  api-key: ${EXA_API_KEY:}
  search-type: ${EXA_SEARCH_TYPE:auto}
  num-results: ${EXA_NUM_RESULTS:10}
  max-age-hours: ${EXA_MAX_AGE_HOURS:24}
  timeout-seconds: ${EXA_TIMEOUT_SECONDS:15}

firecrawl:
  enabled: ${FIRECRAWL_ENABLED:false}
  api-url: ${FIRECRAWL_API_URL:https://api.firecrawl.dev}
  api-key: ${FIRECRAWL_API_KEY:}
  timeout-seconds: ${FIRECRAWL_TIMEOUT_SECONDS:60}
  max-pages: ${FIRECRAWL_MAX_PAGES:50}

devorbit:
  knowledge:
    marker-md-dir: ${KNOWLEDGE_MARKER_MD_DIR:./data/processed/marker-md}
    ingestion:
      enabled: ${KNOWLEDGE_INGESTION_ENABLED:true}

supabase:
  url: ${SUPABASE_URL:}
  key: ${SUPABASE_KEY:}
  bucket: ${SUPABASE_BUCKET:devorbit}

logging:
  level:
    root: WARN
    vn.edu.uit.devorbit_api: INFO
