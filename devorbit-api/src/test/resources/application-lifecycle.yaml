spring:
  datasource:
    url: jdbc:h2:mem:devorbit_lifecycle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        hbm2ddl.schema_filter_provider: vn.edu.uit.devorbit_api.lifecycle.LifecycleTestSchemaFilter
  flyway:
    enabled: false
  sql:
    init:
      mode: never

app:
  github:
    token: test-token
  jwt:
    secret: test-jwt-secret-key-that-is-long-enough-32-char
    expiration-minutes: 120
  embedding:
    offline: true

devorbit:
  database:
    hardening:
      enabled: false
