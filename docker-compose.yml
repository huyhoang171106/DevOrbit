version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: devorbit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devorbit_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devorbit_local_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./devorbit-api
      dockerfile: Dockerfile
      args:
        SERVER_PORT: ${SERVER_PORT:-8080}
    container_name: devorbit-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-devorbit_db}
      DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-devorbit_local_password}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      JPA_FORMAT_SQL: ${JPA_FORMAT_SQL:-false}
      SQL_INIT_MODE: ${SQL_INIT_MODE:-never}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITHUB_USER_AGENT: ${GITHUB_USER_AGENT:-DevOrbit/1.0}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      SERVER_PORT: ${SERVER_PORT:-8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-devorbit}
      OPENAPI_LOCAL_DEV_URL: ${OPENAPI_LOCAL_DEV_URL:-http://localhost:8080}
      API_CONTACT_EMAIL: ${API_CONTACT_EMAIL:-devorbit@uit.edu.vn}
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"

  web:
    build:
      context: ./devorbit-web
      dockerfile: Dockerfile
      args:
        NGINX_PORT: ${NGINX_PORT:-80}
        NGINX_API_PROXY_PASS: ${NGINX_API_PROXY_PASS:-http://api:8080}
    container_name: devorbit-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "${WEB_PORT:-3000}:${NGINX_PORT:-80}"

volumes:
  pgdata:
